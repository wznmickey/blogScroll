# Used by .github/workflows/pages.yml and publish.yml (run from backend/). The
# database is carried between runs in the Actions cache, so ETags, refresh
# intervals and backoff survive exactly as on a long-running server.
# Set the User-Agent with the FEED_USER_AGENT repository variable.

[server]
# Bloggers are pointed here to ask for changes (「我的 → 我的博客」).
repo = "https://github.com/wznmickey/blogScroll"

[server.maintainer]
name = "静静"
url = "https://wznmickey.com/"

[database]
path = "data/feed.db"

[crawler]
user_agent = "blogScroll/0.1 (RSS reader; low frequency; honours ETag, Cache-Control and Retry-After)"

# 站长本人的博客：全文、站内评论区，关于页取整页。
[[policy.full_text]]
site = "https://wznmickey.com"
note = "站长本人的博客"

[[policy.embed_comments]]
site = "https://wznmickey.com"
note = "站长本人的博客"

[[policy.about]]
site = "https://wznmickey.com"
url = "https://wznmickey.com/about/"
full = true
note = "站长本人的博客"

# Personal blogs added by hand, beside the webring (also read by backend/config.toml).
[[sources.opml]]
path = "feeds.opml"
kind = "blog"
