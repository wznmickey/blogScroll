# docker compose up -d     → http://127.0.0.1:8080
#
# Uses the image CI publishes to GitHub Container Registry; replace OWNER/REPO
# with your repository (lowercase), or comment out `image` to build locally.
services:
  feed:
    image: ghcr.io/OWNER/REPO:latest
    build: .
    restart: unless-stopped
    ports:
      # Put a reverse proxy (Caddy, nginx) in front for HTTPS.
      - "127.0.0.1:8080:8080"
    # environment:
    #   # Tell site owners how to reach you.
    #   FEED_USER_AGENT: "blogScroll/0.1 (RSS reader; +https://your.site/about)"
    volumes:
      - feed-data:/data
      # Optional: your own config (create the file first).
      # - ./config.toml:/app/config.toml:ro

volumes:
  feed-data:
