[package]
name = "feed-server"
version = "0.1.0"
edition = "2024"

[dependencies]
ammonia = "4.2.4"
anyhow = "1.0.104"
axum = "0.8.9"
bytes = "1.12.1"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive", "env"] }
feed-rs = "3.0.0"
futures = "0.3.34"
hex = "0.4.3"
jieba-rs = { version = "0.11.0", features = ["tfidf"] }
pulldown-cmark = { version = "0.13.6", default-features = false }
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "gzip", "brotli", "deflate", "json", "stream"] }
scraper = "0.29.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
toml = "1.2.1"
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = ["fs", "trace", "cors", "compression-gzip"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["test-util", "macros", "rt"] }
