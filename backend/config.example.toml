# Copy to config.toml and adjust. Every key is optional; defaults are shown.

[server]
listen = "127.0.0.1:8080"
site_name = "博客瀑布"
# Built frontend; served at / when it exists.
static_dir = "../frontend/dist"
# API responses kept in memory (each lives 1–10 minutes; ETag + Cache-Control are sent).
api_cache_entries = 512
# Columns of the waterfall on the widest screens (1–12). Narrower screens get
# fewer (one more per 320px from 640px wide), two on a phone.
columns = 6
# The site's source repository: 「我的 → 我的博客」 points bloggers there to
# ask for changes (an issue, or a pull request editing repo_config).
# repo = "https://github.com/you/blogscroll"
# repo_config = "deploy/config.actions.toml"
# Who runs the site, shown on the about page (with a link to their blog).
# [server.maintainer]
# name = "你的名字"
# url = "https://your.blog/"

[database]
path = "data/feed.db"

[crawler]
# Please identify yourself: site owners should be able to reach you.
user_agent = "blogScroll/0.1 (RSS reader; low frequency; honours ETag, Cache-Control and Retry-After)"
# Requests in flight at once, across all sites.
max_concurrency = 4
# Minimum seconds between two requests to the same host.
per_host_interval_secs = 10
request_timeout_secs = 20
max_body_bytes = 4194304
# Feed refresh interval adapts between min and max: feeds that rarely change
# are polled less. A feed's <ttl> and HTTP Retry-After are respected.
refresh_secs = 14400        # 4h
min_refresh_secs = 7200     # 2h
max_refresh_secs = 86400    # 24h
# If no feed is found on a blog, wait this long before looking again.
discovery_retry_secs = 604800  # 7 days
directory_sync_secs = 86400
tick_secs = 30
# Blog profile: homepage + about page, re-read this often (2 requests per blog).
profile_refresh_days = 30
# Comment counts from the blog's comment service (Twikoo / Waline / Artalk / Halo):
# one batched request per blog this often; 0 turns it off. A 401/403 pauses it for 30 days.
comment_count_hours = 24
# Entries read from each fetch of a feed; 0 = all of them (the default).
max_items_per_feed = 0
# Keep at most this many posts per blog, deleting the oldest; 0 = keep all (the default).
max_posts_per_blog = 0
# Skip feed entries older than this many days; 0 = no limit (the default).
max_post_age_days = 0

[sources.travellings]
enabled = true
api_url = "https://api.travellings.cn/all"
fallback_url = "https://backup.api.travellings.cn/list.json"
# RUN = all good, LOST = site up but webring badge missing.
live_statuses = ["RUN", "LOST"]

# Any RSS / Atom / JSON feed, not only blogs. Read at every start.
# kind: blog | news | newsletter | podcast | video | forum | other
# Without `name`, the feed's own title is used; give `homepage` to merge
# with a webring member of the same site.
# [[sources.feeds]]
# url = "https://sspai.com/feed"
# kind = "news"
# tags = ["科技"]

# Every feed in an OPML export from a feed reader (path relative to this file).
# [[sources.opml]]
# path = "feeds.opml"
# kind = "blog"

[policy]
# Authors who asked to be left out. Their sites are never requested and
# their stored posts are deleted on the next start / sync.
exclude = [
  # "https://example.com",
]

# Authors who explicitly allowed full-text fetching. Only these blogs ever have
# article pages fetched or full content stored; everyone else gets an excerpt
# and a link to the original.
# [[policy.full_text]]
# site = "https://example.com"
# note = "Permission by email, 2026-11-01"

# Authors who allowed their own comment widget (Twikoo / Waline / Artalk /
# Giscus / Utterances) to be shown under their posts here. They also need to
# allow this site's domain in their comment service.
# [[policy.embed_comments]]
# site = "https://example.com"
# note = "Permission by email, 2026-11-10"

# About-page settings an author asked for: which page is their about page,
# the whole page (formatted) instead of a 300-character excerpt, or their own
# introduction instead of the page's. Changing url or full re-reads the page soon.
# [[policy.about]]
# site = "https://example.com"
# url = "https://example.com/about-me/"
# full = true
# text = "自己写的介绍，可以多行。"
# note = "Asked by email, 2026-11-10"

# What an author asked to be shown instead of what was found on their site.
# Every key is optional; what is found stays stored, so removing a key brings
# it back. social replaces the links found (the platform is recognised from
# each URL); tags replaces the tags shown for the blog (标签).
# [[policy.profile]]
# site = "https://example.com"
# avatar = "https://example.com/me.png"
# description = "一句话介绍"
# social = ["https://github.com/someone", "https://x.com/someone"]
# tags = ["Rust", "摄影"]
# The about page, as in [[policy.about]] below, can be set here too:
# about = "https://example.com/about-me/"
# about_full = true
# about_text = "自己写的介绍"
# note = "Asked in issue #12"

# Hand-set feed URLs (skips discovery for that blog).
# [[policy.feed_overrides]]
# site = "https://example.com"
# feed = "https://example.com/custom/rss.xml"

# Back up what was crawled to a git repository, e.g. a private one on GitHub:
# a text snapshot (one JSON file per blog) committed when something changed,
# then pushed. git's own credentials are used: an SSH deploy key with write
# access, or a token in the remote URL. Restore with
# `feed-server restore --from <git_dir>` into a new, empty database.
# [backup]
# git_dir = "data/backup"                        # relative to this file
# remote = "git@github.com:you/blogscroll-data.git"  # cloned into git_dir if it is not a repository yet
# every_hours = 6                                # while serving; 0 = only `feed-server backup`
# push = true
