# Static mode: crawl on a schedule and publish to GitHub Pages, no server needed.
#
# Off until you opt in, so pushing the repo never starts crawling by surprise:
#   1. Settings → Pages → Source: "GitHub Actions"
#   2. Settings → Secrets and variables → Actions → Variables:
#        ENABLE_PAGES_CRAWL = true
#        FEED_USER_AGENT    = FeedWaterfall/0.1 (RSS reader; +https://<how to reach you>)
# Do not also run the server image against the same blogs; that doubles their load.
name: Crawl & publish (GitHub Pages)

on:
  schedule:
    # Every 3 hours. Each run only fetches feeds that are due (304s for most).
    - cron: '17 */3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write # prune old database caches

concurrency:
  group: pages-crawl
  cancel-in-progress: false

jobs:
  crawl-and-publish:
    if: vars.ENABLE_PAGES_CRAWL == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      FEED_CONFIG: ../deploy/config.actions.toml
      FEED_USER_AGENT: ${{ vars.FEED_USER_AGENT }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # The SQLite database is the crawler's memory (ETags, schedules, backoff).
      # Each run saves a new cache entry; the newest one is restored.
      - name: Restore crawler database
        uses: actions/cache/restore@v6
        with:
          path: backend/data
          key: feed-db-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: feed-db-

      - name: Build crawler
        working-directory: backend
        run: cargo build --release --locked

      - name: Crawl due feeds
        working-directory: backend
        # The first run discovers ~1300 feeds (about an hour); later runs take minutes.
        run: ./target/release/feed-server crawl --sync --all --limit 200 --max-minutes 100

      - name: Save crawler database
        if: always()
        uses: actions/cache/save@v6
        with:
          path: backend/data
          key: feed-db-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Prune old database caches
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh cache list -R "$GITHUB_REPOSITORY" --key feed-db- --sort created_at --order desc --limit 100 \
            --json id --jq '.[3:][].id' | xargs -r -n1 gh cache delete -R "$GITHUB_REPOSITORY"

      - id: pages
        uses: actions/configure-pages@v6

      - name: Build static site
        working-directory: frontend
        env:
          VITE_STATIC: '1'
          VITE_BASE: ${{ steps.pages.outputs.base_path }}/
        run: |
          npm ci
          npm run build

      - name: Export data
        working-directory: backend
        run: ./target/release/feed-server export --out ../frontend/dist/data

      - uses: actions/upload-pages-artifact@v5
        with:
          path: frontend/dist

      - id: deploy
        uses: actions/deploy-pages@v5
