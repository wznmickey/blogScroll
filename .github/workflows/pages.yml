# Static mode: crawl on a schedule and publish to GitHub Pages, no server needed.
#
# Off until you opt in, so pushing the repo never starts crawling by surprise:
#   1. Settings → Pages → Source: "GitHub Actions"
#   2. Settings → Secrets and variables → Actions → Variables:
#        ENABLE_PAGES_CRAWL = true
#        FEED_USER_AGENT    = blogScroll/0.1 (RSS reader; +https://<how to reach you>)
# Do not also run the server image against the same blogs; that doubles their load.
#
# Optional: back up the crawled data to a (private) git repository after each
# run, and rebuild the database from it when the Actions cache is gone (caches
# are evicted after 7 days unused or beyond 10 GB):
#   3. In that repository: Settings → Deploy keys → add a key with write access.
#   4. Here: Secrets → BACKUP_DEPLOY_KEY = the private half of that key;
#            Variables → BACKUP_REPO = owner/name, e.g. you/blogscroll-data.
# Backups only ever add commits; see "备份到 GitHub 私有仓库" in README.md.
name: Crawl & publish (GitHub Pages)

on:
  schedule:
    # Every 3 hours. Each run only fetches feeds that are due (304s for most).
    - cron: '17 */3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write # prune old database caches

concurrency:
  group: pages-crawl
  cancel-in-progress: false

jobs:
  crawl-and-publish:
    if: vars.ENABLE_PAGES_CRAWL == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      FEED_CONFIG: ../deploy/config.actions.toml
      FEED_USER_AGENT: ${{ vars.FEED_USER_AGENT }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # The SQLite database is the crawler's memory (ETags, schedules, backoff).
      # Each run saves a new cache entry; the newest one is restored.
      - name: Restore crawler database
        id: cache
        uses: actions/cache/restore@v6
        with:
          path: backend/data
          key: feed-db-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: feed-db-

      - name: Build crawler
        working-directory: backend
        run: cargo build --release --locked

      - name: Use the backup repository's deploy key
        if: vars.BACKUP_REPO != ''
        env:
          DEPLOY_KEY: ${{ secrets.BACKUP_DEPLOY_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/backup_key
          chmod 600 ~/.ssh/backup_key
          echo "GIT_SSH_COMMAND=ssh -i $HOME/.ssh/backup_key -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=accept-new" >> "$GITHUB_ENV"

      # No cache to carry on from: start from the last backup instead of from nothing.
      - name: Restore crawler database from the backup
        if: vars.BACKUP_REPO != '' && steps.cache.outputs.cache-matched-key == ''
        working-directory: backend
        run: |
          git clone --quiet --depth 1 "git@github.com:${{ vars.BACKUP_REPO }}.git" "$RUNNER_TEMP/backup"
          if [ -f "$RUNNER_TEMP/backup/meta.json" ]; then
            ./target/release/feed-server restore --from "$RUNNER_TEMP/backup"
          else
            echo "The backup repository has no snapshot yet; starting from nothing."
          fi

      - name: Crawl due feeds
        working-directory: backend
        # The first run discovers ~1300 feeds (about an hour); later runs take minutes.
        run: ./target/release/feed-server crawl --sync --all --limit 200 --max-minutes 100

      # Commits only when something changed; never force-pushes. A failure here
      # does not stop the site from being published.
      - name: Back up to the git repository
        if: always() && vars.BACKUP_REPO != ''
        continue-on-error: true
        working-directory: backend
        run: >-
          ./target/release/feed-server backup
          --git-dir "$RUNNER_TEMP/backup"
          --remote "git@github.com:${{ vars.BACKUP_REPO }}.git"

      - name: Save crawler database
        if: always()
        uses: actions/cache/save@v6
        with:
          path: backend/data
          key: feed-db-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Prune old database caches
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh cache list -R "$GITHUB_REPOSITORY" --key feed-db- --sort created_at --order desc --limit 100 \
            --json id --jq '.[3:][].id' | xargs -r -n1 gh cache delete -R "$GITHUB_REPOSITORY"

      - id: pages
        uses: actions/configure-pages@v6

      - name: Build static site
        working-directory: frontend
        env:
          VITE_STATIC: '1'
          VITE_BASE: ${{ steps.pages.outputs.base_path }}/
        run: |
          npm ci
          npm run build

      - name: Export data
        working-directory: backend
        run: ./target/release/feed-server export --out ../frontend/dist/data

      - uses: actions/upload-pages-artifact@v5
        with:
          path: frontend/dist

      - id: deploy
        uses: actions/deploy-pages@v5
