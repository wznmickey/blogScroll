# Static mode, part 2: build the site from the newest crawled database and
# publish it: to Cloudflare once its token is set (the files, plus worker/
# for sync between a reader's devices and feeds they add themselves), and to
# GitHub Pages unless the variable PUBLISH_TO_PAGES = false. No crawling here, so
# it takes minutes:
#   - after each push to main whose tests passed (CI), so code changes go out
#     without waiting for the next crawl;
#   - at the end of every crawl (pages.yml);
#   - by hand (Actions → Publish site → Run workflow).
# Off until ENABLE_PAGES_CRAWL = true, like the crawl (see pages.yml).
#
# Cloudflare (see "发布到 Cloudflare" in README.md):
#   Secrets   → CLOUDFLARE_API_TOKEN  (Workers Scripts: Edit, D1: Edit)
#   Variables → CLOUDFLARE_ACCOUNT_ID, SITE_URL = https://<the site's address>
name: Publish site

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  publish:
    # From CI: only when its tests passed.
    if: >-
      vars.ENABLE_PAGES_CRAWL == 'true' &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # A newer publish replaces one still in progress.
    concurrency:
      group: pages-publish
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      FEED_CONFIG: ../deploy/config.actions.toml
      FEED_USER_AGENT: ${{ vars.FEED_USER_AGENT }}
      TO_CLOUDFLARE: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
      TO_GITHUB_PAGES: ${{ vars.PUBLISH_TO_PAGES != 'false' }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The commit CI tested; otherwise the branch as it is now.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Read only: whatever changes here (migrations, analysis) is redone by
      # the next crawl, which owns the database.
      - name: Restore crawler database
        id: cache
        uses: actions/cache/restore@v6
        with:
          path: backend/data
          key: feed-db-publish-${{ github.run_id }}
          restore-keys: feed-db-

      - name: Build exporter
        working-directory: backend
        run: cargo build --release --locked

      - name: Use the backup repository's deploy key
        id: key
        if: vars.BACKUP_REPO != ''
        uses: ./.github/actions/backup-key
        with:
          deploy-key: ${{ secrets.BACKUP_DEPLOY_KEY }}

      # Publish everything backed up, also by other crawlers (and not an empty
      # site when there is no cache). Only this run's copy changes.
      - name: Merge the backup into the database
        if: steps.key.outputs.ok == 'true'
        continue-on-error: true
        working-directory: backend
        run: |
          git clone --quiet --depth 1 "git@github.com:${{ vars.BACKUP_REPO }}.git" "$RUNNER_TEMP/backup"
          if [ -f "$RUNNER_TEMP/backup/meta.json" ]; then
            ./target/release/feed-server restore --from "$RUNNER_TEMP/backup"
          fi

      - id: pages
        if: env.TO_GITHUB_PAGES == 'true'
        uses: actions/configure-pages@v6

      - name: Build static site
        working-directory: frontend
        env:
          VITE_STATIC: '1'
          VITE_BASE: ${{ steps.pages.outputs.base_path }}/
        run: |
          npm ci
          npm run build

      # Data for the app, plus pages for search engines (blog/<key>/,
      # sitemap.xml, ...) built around the app's index.html.
      - name: Export data and pages
        working-directory: backend
        run: >-
          ./target/release/feed-server export
          --out ../frontend/dist/data
          --site-url "${{ vars.SITE_URL || steps.pages.outputs.base_url }}"

      - if: env.TO_GITHUB_PAGES == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: frontend/dist

      - id: deploy
        if: env.TO_GITHUB_PAGES == 'true'
        uses: actions/deploy-pages@v5

      # The same files on Cloudflare, with the Worker for /api/*. The first
      # deploy also makes its database (D1); the Worker makes its table.
      - name: Publish to Cloudflare
        if: env.TO_CLOUDFLARE == 'true'
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
        run: >-
          npx --yes wrangler@4.148.0 deploy
          --var "GITHUB_REPO:$GITHUB_REPOSITORY"
          ${FEED_USER_AGENT:+--var "USER_AGENT:$FEED_USER_AGENT"}
